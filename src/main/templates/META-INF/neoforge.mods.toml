# Mod metadata for Create JEI Gauge Bridge.
# The dollar-brace placeholders below are expanded by the generateModMetadata task from
# gradle.properties at build time.
modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

# The [[mixins]] block allows you to declare your mixin config to FML so that it gets loaded.
[[mixins]]
config = "${mod_id}.mixins.json"

# =================================================================================================
# Required dependencies
# =================================================================================================

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Create supplies the factory gauge API this bridge reads.
[[dependencies."${mod_id}"]]
modId = "create"
type = "required"
versionRange = "${create_version_range}"
ordering = "AFTER"
side = "BOTH"

# JEI is the viewer the gauge categories are registered with. It is a client-side mod, so the
# requirement is enforced on the client only: dedicated servers can still load this mod without it.
[[dependencies."${mod_id}"]]
modId = "jei"
type = "required"
versionRange = "${jei_version_range}"
ordering = "AFTER"
side = "CLIENT"

# =================================================================================================
# Optional dependencies - integrated when present, silently ignored when absent.
# =================================================================================================

# Create: Improve - Template Panel / Work Warehouse / extra gauge tooling.
[[dependencies."${mod_id}"]]
modId = "createimp"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

# Create: Fluid Logistics - fluid variants of the factory gauges.
[[dependencies."${mod_id}"]]
modId = "fluidlogistics"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

# EMI - alternative recipe viewer; the + button uses its native handler when present.
[[dependencies."${mod_id}"]]
modId = "emi"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "CLIENT"

# Create: Extra Gauges - filter gauges can be picked as recipe ingredient sources.
[[dependencies."${mod_id}"]]
modId = "extra_gauges"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"
