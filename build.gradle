plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()

    // Create (机械动力) - official maven. The old maven.tterrag.com host is gone.
    maven {
        name = 'CreateMod'
        url = 'https://maven.createmod.net'
    }

    // JEI - official maven. This repository also serves the JEI API artifacts.
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }

    // Cloth Config - runtime prerequisite of the optional Create: Improve (see dependencies below).
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me'
    }

    // Create: Improve and Create: Fluid Logistics - optional addons mirrored by Modrinth's maven.
    // Coordinates are maven.modrinth:<modrinth slug>:<modrinth version number>.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }


dependencies {
    // =============================================================================================
    // REQUIRED: Create - the factory gauge / logistics API this mod bridges into JEI.
    // =============================================================================================
    // compileOnly on purpose: Create must never be packaged into our jar, the player's mods/ folder
    // provides it. transitive = false because Create's pom pulls compile-time-only integration libs
    // (FTB, Curios, CC:Tweaked, Architectury, journeymap, Farmer's Delight) that no reachable maven
    // serves; Create's own jar-in-jar supplies what it needs at runtime.
    compileOnly("com.simibubi.create:create-1.21.1:${create_version}") { transitive = false }
    // Create's compile-time companions. javac needs them to resolve parts of Create's class
    // hierarchy (SmartBlockEntity -> ponder's VirtualBlockEntity, renderers -> flywheel) even when
    // our code only touches gauge classes.
    compileOnly("net.createmod.ponder:ponder-neoforge:${ponder_version}") { transitive = false }
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:${flywheel_version}") { transitive = false }
    // Dev runtime only: neoforge.mods.toml declares Create as required, so runClient/runServer
    // refuse to start without it. runtimeOnly never reaches the published jar.
    runtimeOnly("com.simibubi.create:create-1.21.1:${create_version}") { transitive = false }

    // =============================================================================================
    // REQUIRED: JEI - the recipe viewer the gauge categories are registered with.
    // =============================================================================================
    // The API artifact is compile-time only (the player's mods/ folder ships the implementation);
    // the full artifact is what the dev client loads at runtime.
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-1.21.1-neoforge:${jei_version}"

    // =============================================================================================
    // OPTIONAL: Create: Improve - extra gauges and template panels, integrated when present.
    // =============================================================================================
    // Declared with type = "optional" in neoforge.mods.toml, so the mod still loads when it is absent.
    // compileOnly lets compat code reference its API without ever linking to it at runtime.
    compileOnly("maven.modrinth:create-improve:${createimp_version}") { transitive = false }
    // Installed into the dev runtime for testing.
    runtimeOnly("maven.modrinth:create-improve:${createimp_version}") { transitive = false }
    // Create: Improve hard-requires Cloth Config (its own neoforge.mods.toml lists it as required).
    // Without this jar FML aborts the whole game, so it is part of the dev runtime even though this
    // project never compiles against it.
    runtimeOnly("me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}") { transitive = false }

    // =============================================================================================
    // OPTIONAL: Create: Fluid Logistics - fluid factory gauges, integrated when present.
    // =============================================================================================
    compileOnly("maven.modrinth:createfluidlogistic:${fluidlogistics_version}") { transitive = false }
    runtimeOnly("maven.modrinth:createfluidlogistic:${fluidlogistics_version}") { transitive = false }

    // =============================================================================================
    // OPTIONAL: EMI - a second recipe viewer. Its "+" support uses its own handler API.
    // =============================================================================================
    compileOnly("maven.modrinth:emi:${emi_version}") { transitive = false }
    runtimeOnly("maven.modrinth:emi:${emi_version}") { transitive = false }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             create_version_range   : create_version_range,
                             jei_version_range      : jei_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
