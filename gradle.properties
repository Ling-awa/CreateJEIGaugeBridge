# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
## Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=1.21.1
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
minecraft_version_range=[1.21.1,1.22)
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=21.1.265
# The Neo version range can use any version of Neo as bounds
neo_version_range=[21,)
# The loader version range can only use the major version of FML as bounds
loader_version_range=[4,)
# Parchment mappings must be for minecraft_version, not for some newer MC line: the names are keyed
# to that version's obfuscated symbols and will not apply to another one.
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
## Mod Properties
# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=create_jei_gauge_bridge
# The human-readable display name for the mod.
mod_name=Create JEI Gauge Bridge
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=MIT
# The mod version. See https://semver.org/
mod_version=0.1.0
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=io.github.Ling
# The authors of the mod. This is a simple text string that is used for display purposes in the mod list.
mod_authors=Ling
# The description of the mod. This is a simple multiline text string that is used for display purposes in the mod list.
mod_description=A compatibility bridge that exposes Create's factory gauges to JEI.
## Dependency versions
# Create (机械动力) - REQUIRED. https://maven.createmod.net
# Pinned to the published 1.21.1 release, not to maven's <release> pointer: that pointer already reads
# 6.0.11-346, but the 6.0.11 line never shipped to players (Modrinth/CurseForge latest 1.21.1 release is
# 6.0.10, internal mod version "6.0.10"). 6.0.10-280 is the build matching that upload. Create: Fluid
# Logistics 1.3.2 requires >= 6.0.10 too, so this is also the floor for the optional addons.
create_version=6.0.10-280
# Version range declared in neoforge.mods.toml for the required "create" dependency.
create_version_range=[6.0.10,)
# Create's compile-time companions. These are the exact versions Create 6.0.10-280 bundles in its
# META-INF/jarjar/metadata.json, so compiling against them cannot drift from what the game loads.
ponder_version=1.0.82+mc1.21.1
flywheel_version=1.0.6
# JEI - REQUIRED. https://maven.blamejared.com (the "neoforge" flavor matches this loader).
jei_version=19.57.0.449
# Version range declared in neoforge.mods.toml for the required "jei" dependency.
jei_version_range=[19.57.0,)
# Create: Improve - OPTIONAL. https://api.modrinth.com/maven; the version is the Modrinth version number.
createimp_version=1.4.5
# Create: Improve declares Cloth Config as a hard requirement of its own, so the dev client cannot load
# it without this jar. Runtime only: nothing here compiles against Cloth Config.
cloth_config_version=15.0.140
# Create: FluidLogistics - OPTIONAL. Same Modrinth maven, same coordinate scheme.
fluidlogistics_version=1.3.2-mc1.21.1
# EMI - OPTIONAL second recipe viewer. https://api.modrinth.com/maven
# When EMI is installed it takes over the "+" button (native EmiRecipeHandler), and the JEI
# transfer handler is not registered to avoid EMI's JEMI bridge wrapping it.
emi_version=1.1.24+1.21.1+neoforge
